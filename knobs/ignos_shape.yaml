# ignos_shape: the IGNOS campaign shape (few campaigns, each population 16 x 20 generations, longer
# simulations), still turned down from the real sizes. Not calibrated. All physics output is synthetic.

sim:
  nodes_per_plane: 20000      # real 90445
  planes: 8                   # real 16
  rollout_steps: 2            # real 2
  puffs: 6                    # real 6
  fixed_point_cap: 60         # real 300
  model_width: 64
  checkpoint_mb: 16
  device: auto
  cold_start_fraction: 0.0
  keep_artifacts: false
  work_root: null
  threads_per_worker: auto

agents:
  count: 4
  first: 0
  per_process: 1
  max_live: null
  start_together: false       # the AUTONMI layer: true = generation 0 waits until every agent has started
  cost_scale: 1.0
  thinking_budget: 1024
  budget_scales_with_cost: false

tools:
  constraints_lookup: true
  abstract_lookup: true
  latency_ms: 0

llm:
  mode: stub
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  model: stub
  send_thinking_budget: true  # false for a server that rejects the thinking_token_budget field
  timeout_s: 120              # per model call
  max_retries: 2              # per model call, on connection errors and 5xx
  min_model_share: 0.5        # openai mode: the run fails if the model filled fewer refill slots than this share
  max_empty_share: 0.1        # openai mode: the run fails if more replies than this share were empty
  stub_latency_s: 0.001       # the stub's seconds per call (emulated)
  max_in_flight: 512          # model requests admitted at once per model server (the AUTONMI layer)
  admission_tokens: 2000000   # tokens admitted at once per model server (the AUTONMI layer)

workers:
  sim_workers: 4

outer:                        # each campaign's IGNOS outer loop: the parent's run_evolutionary_loop (the parent campaign: 320 evaluations)
  population: 16              # P, candidates per generation, all evaluated at once
  generations: 20             # G; evaluations per campaign = P x G, model calls = G
  generator: llm              # llm: one model call per refill replaces mutants; mutation: the parent's loop exactly
  rng: shared                 # shared: one generator, as run_evolutionary_loop; per_agent: two streams, as evo_agents.py
  logs: per_agent             # per_agent: the parent's evolution_log.csv/.jsonl, config.json, best_result.json per campaign
  wall_weight: 0.7            # the parent's DEFAULT_WALL_WEIGHT
  noise: 0.1                  # the parent's mutation amplitude
  parent_stdout: keep         # keep: the parent's per-generation prints; drop: discard them
