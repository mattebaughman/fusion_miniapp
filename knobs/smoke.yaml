# smoke: the complete base preset. Every other knob file is merged over this one.
# One evaluate is a fraction of a second on a laptop CPU once the worker is warm.
# All physics output is synthetic (random-weight stand-in models); no value here is calibrated.

sim:                          # the turn-down; "real" = the IGNOS loop at FusionFM/Demo 9768bcb
  nodes_per_plane: 200        # real 90445
  planes: 2                   # real 16
  rollout_steps: 2            # real 2 (graph forwards per evaluation = 1 + rollout_steps)
  puffs: 2                    # real 6 (independent fixed points)
  fixed_point_cap: 3          # real 300; every fixed point runs to the cap: puffs x cap small forwards
  model_width: 8              # hidden width of both stand-in models (even)
  checkpoint_mb: 0            # padding added to the graph checkpoint, loaded twice per evaluation
  device: auto                # auto = cuda if torch.cuda.is_available() else cpu; or cpu, cuda, mps
  cold_start_fraction: 0.0    # share of evaluations run in a fresh worker process (a new one every round(1/f))
  keep_artifacts: false       # keep each evaluation's work directory (11 files at rollout_steps 2)
  work_root: null             # parent of work directories; null = system temp; $VARS are expanded
  threads_per_worker: auto    # CPU threads per simulation worker (OMP, OpenBLAS, MKL, torch); auto = CPUs / workers

agents:
  count: 100                  # campaigns
  first: 0                    # the first campaign's index and seed: campaigns a<first> .. a<first+count-1>
  per_process: 1000           # agents per agent process; each process also starts its own simulation workers
  max_live: null              # campaigns live at once in each agent process; null = all of them
  start_together: false       # the AUTONMI layer: true = no campaign begins generation 0 until every
                              # hosted agent of its population has started (needs max_live: null)
  cost_scale: 1.0             # multiplier on nodes_per_plane and fixed_point_cap; a list such as [0.5, 1, 4]
                              # gives agent i entry i % len (keep the list short: one context per value)
  thinking_budget: 64         # thinking tokens per LLM call
  budget_scales_with_cost: false   # true: each agent's budget = thinking_budget x its cost_scale

tools:
  constraints_lookup: true
  abstract_lookup: true
  latency_ms: 0

llm:
  mode: stub                  # stub | openai (an endpoint that accepts vLLM's thinking_token_budget)
  base_url_env: OPENAI_BASE_URL   # names of environment variables, never their values
  api_key_env: OPENAI_API_KEY
  model: stub                 # set to the served model's name for mode openai
  send_thinking_budget: true  # false for a server that rejects the thinking_token_budget field
  timeout_s: 120              # per model call
  max_retries: 2              # per model call, on connection errors and 5xx
  min_model_share: 0.5        # openai mode: the run fails if the model filled fewer refill slots than this share
  max_empty_share: 0.1        # openai mode: the run fails if more replies than this share were empty
  stub_latency_s: 0.001       # the stub's seconds per call: emulates a model server's time, never its decoding
  max_in_flight: 512          # model requests admitted at once per model server (the AUTONMI layer; run.py's
                              # layers keep llm.MAX_IN_FLIGHT); tune per server
  admission_tokens: 2000000   # tokens admitted at once per model server (the AUTONMI layer); 0: requests only

workers:
  sim_workers: 2              # simulation worker processes in all; each agent process gets sim_workers // processes

outer:                        # each campaign's IGNOS outer loop: the parent's run_evolutionary_loop (smoke: 8 evaluations per campaign)
  population: 4               # P, candidates per generation, all evaluated at once
  generations: 2              # G; evaluations per campaign = P x G, model calls = G
  generator: llm              # llm: one model call per refill replaces mutants; mutation: the parent's loop exactly
  rng: shared                 # shared: one generator, as run_evolutionary_loop; per_agent: two streams, as evo_agents.py
  logs: per_agent             # per_agent: the parent's evolution_log.csv/.jsonl, config.json, best_result.json per campaign
  wall_weight: 0.7            # the parent's DEFAULT_WALL_WEIGHT
  noise: 0.1                  # the parent's mutation amplitude
  parent_stdout: keep         # keep: the parent's per-generation prints; drop: discard them

monitor:                      # the inner-loop trace for the Monitor: added instrumentation, not in IGNOS (trace.py)
  capture: true               # each evaluation's record carries `trace` (the AUTONMI layer; the LangGraph and
                              # Academy layers never ask for one). It changes no result
  fixture_trace: smooth       # --sim fixture, which has no inner loop: smooth (a function of the parameters with
                              # one planted split) or hash (random, ending at the record's values); synthetic
  weight: 0.25                # the Monitor's m in a result's score in the asynchronous mode (not built yet); the
                              # generation-by-generation mode selects on the inner loop's numbers alone

campaign:                     # the AUTONMI layer: each campaign's Monitor slots and its candidate queue
  slots: 2                    # Monitor agents per campaign (3 + slots hosted agents): each takes the next
                              # candidate from its campaign's queue, runs its inner loop and scores its trace
  mode: generations           # generations: the parent's generation barrier, as IGNOS; results equal IGNOS's
                              # at any slot count
  warmup: 4                   # traces the good side and the bad side each hold before the Monitor's m is not 0

record:
  extras: false               # true: each candidate's Monitor numbers in its campaign's line (agents.jsonl);
                              # false: counts only
